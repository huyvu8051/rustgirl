[package]
name = "rustgirl"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "6.0.0"
eframe = "0.35.0"
egui = "0.35.0"
egui_extras = "0.35.0"
reqwest = { version = "0.13.4", features = ["json", "cookies", "query", "form"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
