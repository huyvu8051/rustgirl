[package]
name = "rustgirl"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
cookie_store = "=0.22.1"
csv = "1.4.0"
dirs = "6.0.0"
eframe = { version = "0.35.0", features = ["accesskit"] }
egui = "0.35.0"
egui_extras = "0.35.0"
hex = "0.4.3"
hmac = "0.13.0"
md-5 = "0.11.0"
mlua = { version = "0.9", features = ["lua54", "vendored", "serialize"] }
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["json", "cookies", "query", "form", "multipart", "socks"] }
reqwest_cookie_store = { version = "0.10.0", features = ["serde"] }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_yaml = "0.9.34"
sha1 = "0.11.0"
sha2 = "0.11.0"
shell-words = "1.1.1"
similar = "3.1.2"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
egui_kittest = { version = "=0.35.0", features = ["eframe", "snapshot", "wgpu"] }
